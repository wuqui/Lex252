name: Generate Slide PDFs

on:
  workflow_run:
    workflows:
      - "Publish Quarto Site"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-pdfs:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (scripts)
        uses: actions/checkout@v4

      - name: Checkout gh-pages (published site)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate PDFs
        run: ./scripts/generate-pdfs.sh gh-pages

      - name: Add PDFs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages
          keep_files: true
