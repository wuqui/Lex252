date: last-modified

project:
  type: website
  output-dir: _site

site-url: https://wuqui.github.io/Lex252/

website:
  title: "Lex252"
  description: "Lexicology and Lexicography"
  navbar:
    left:
      - text: "Sessions"
        menu:
          - text: "Introduction"
            href: sessions/01_intro/01_intro.qmd
          - text: "The lexicon"
            href: sessions/02_lexicon/02_lexicon.qmd
          - text: "Morphology"
            href: sessions/03_morphology/03_morphology.qmd
          - text: "Dictionaries"
            href: sessions/04_dictionaries/04_dictionaries.qmd
          - text: "Using dictionaries"
            href: sessions/05_dictionaries-2/05_dictionaries-2.qmd
          - text: "Corpora"
            href: sessions/06_corpora/06_corpora.qmd
          - text: "Semantics"
            href: sessions/07_semantics/07_semantics.qmd
          - text: "Studying lexis empirically"
            href: sessions/08_research-projects/08_research-projects.qmd
          - text: "Lexical innovation"
            href: sessions/09_lexical-innovation/09_lexical-innovation.qmd
          - text: "Language change"
            href: sessions/10_language-change/10_language-change.qmd
          - text: "Lexical variation"
            href: sessions/11_lexical-variation/11_lexical-variation.qmd
  page-navigation: true
  search: true

format:
  html:
    theme: light
    toc: true
    css: document.css
    fig-cap-location: top
    fig-align: center
  clean-revealjs:
    slide-level: 2
    css:
      - slides.css
    fig-cap-location: top
    fig-align: center
    excalidraw:
      button: false
      shortcut: "`"
      theme: "light"
    filters:
      - filters/slide-break.lua

filters:
  - auto-dark
  - exclude
  - filters/fullcite.lua
  - filters/strip-revealjs-html.lua

revealjs-plugins:
  - pointer
  - excalidraw

bibliography: references.bib

metadata:
  linkprefix: ""

params:
  show_excl: false